name: F6 compatibility with F3

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f6-f3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  combined:
    name: F6 + pinned F3 (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Compose F3 in this disposable CI checkout only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 5617ff033cd29c0a3fa43bb4246be598830cbfcd
          if ! git merge-base --is-ancestor 5617ff033cd29c0a3fa43bb4246be598830cbfcd HEAD; then
            git diff b616164f5ab24faa5371f4eb714276f6080a8bf3 5617ff033cd29c0a3fa43bb4246be598830cbfcd -- index.html sw.js project-store.js tests/project-store.cjs tests/project-store-browser.cjs tests/leiste-browser.cjs tests/projektkontext-browser.cjs > "$RUNNER_TEMP/f3.patch"
            git apply --check "$RUNNER_TEMP/f3.patch"
            git apply "$RUNNER_TEMP/f3.patch"
          fi
          mkdir -p test-results
          git diff --stat > test-results/composition.txt
          printf 'F6 HEAD: %s\nF3 HEAD: 5617ff033cd29c0a3fa43bb4246be598830cbfcd\n' "$(git rev-parse HEAD)" >> test-results/composition.txt
      - name: Immutable old client for integrated N3 attack
        run: |
          git worktree add --detach "$RUNNER_TEMP/n4-old" b616164f5ab24faa5371f4eb714276f6080a8bf3
          echo "N3_OLD_ROOT=$RUNNER_TEMP/n4-old" >> "$GITHUB_ENV"
      - name: Install pinned Playwright
        shell: bash
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}
      - name: All Node regressions on composed application
        shell: bash
        run: |
          for test in tests/laborwerte.cjs tests/unknown-fields.cjs tests/project-store.cjs; do
            node "$test" | tee "test-results/$(basename "$test").log"
          done
      - name: All browser regressions including F3 and F6 on composed application
        shell: bash
        run: |
          for test in tests/*-browser.cjs; do
            node "$test" "${{ matrix.browser }}" | tee "test-results/$(basename "$test").log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f6-f3-${{ matrix.browser }}
          path: test-results/
          retention-days: 14
