name: N2 metadata safety and Spektron compatibility
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: n2-compat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  combined:
    name: N2 + pinned F3/F6 (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Compose pinned F3 and F6 in disposable checkout
        run: |
          git fetch origin 5617ff033cd29c0a3fa43bb4246be598830cbfcd 9c7929b6aebca4dc7fe8d95d7b518ea0946a66d0
          node tests/n2-compose-compat.cjs
          mkdir -p "$RUNNER_TEMP/n2-results"
          git log -3 --format=fuller > "$RUNNER_TEMP/n2-results/composition.txt"
      - name: Install pinned Playwright
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}
      - name: Node regressions including unchanged F3/F6 assertions
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/laborwerte.cjs tests/n2-speichersicherheit.cjs tests/unknown-fields.cjs tests/project-store.cjs; do
            node "$test" | tee "$RUNNER_TEMP/n2-results/$(basename "$test").log"
          done
      - name: All browser regressions
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*-browser.cjs; do
            node "$test" "${{ matrix.browser }}" | tee "$RUNNER_TEMP/n2-results/$(basename "$test").log"
          done
      - name: Shared F3 protocol with unchanged pinned Projektzentrale
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/kaspersebastian83-dot/Projektzentrale.git "$RUNNER_TEMP/central"
          git -C "$RUNNER_TEMP/central" checkout e7b8c4e3819a4ce54fe2dc2ac91bb731e040896f
          cmp project-store.js "$RUNNER_TEMP/central/project-store.js"
          node tests/project-store-browser.cjs "${{ matrix.browser }}" "$RUNNER_TEMP/central" | tee "$RUNNER_TEMP/n2-results/f3-cross-app.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n2-f3-f6-${{ matrix.browser }}
          path: ${{ runner.temp }}/n2-results/
  suite:
    name: Spektron producer consumer and security integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          path: foto
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Compose FotoKit and prepare unchanged suite sources
        shell: bash
        run: |
          set -euo pipefail
          git -C foto fetch origin 5617ff033cd29c0a3fa43bb4246be598830cbfcd 9c7929b6aebca4dc7fe8d95d7b518ea0946a66d0
          (cd foto && node tests/n2-compose-compat.cjs)
          git clone --no-checkout https://github.com/kaspersebastian83-dot/Projektzentrale.git central
          git -C central checkout e7b8c4e3819a4ce54fe2dc2ac91bb731e040896f
          (cd central && node --test tests/integration/provenance.test.mjs && node tests/integration/prepare.mjs)
          git -C central/tests/.integration-work/Bildumbenenner fetch "$GITHUB_WORKSPACE/foto" HEAD
          git -C central/tests/.integration-work/Bildumbenenner checkout --detach FETCH_HEAD
          node - <<'JS'
          const fs=require('fs'),cp=require('child_process'),p='central/tests/integration/stand.json';
          const m=JSON.parse(fs.readFileSync(p));
          m.Bildumbenenner=cp.execFileSync('git',['-C','foto','rev-parse','HEAD'],{encoding:'utf8'}).trim();
          fs.writeFileSync(p,JSON.stringify(m,null,2)+'\n');
          JS
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/pw/node_modules/playwright" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Account for N2 archive additions in the temporary test fixture
        run: node foto/tests/n2-adapt-suite.cjs central
      - name: Full existing suite and security assertions
        working-directory: central
        run: node tests/integration/run.mjs --security
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n2-spektron-suite
          path: |
            central/tests/integration/results/
            central/tests/integration/stand.json
