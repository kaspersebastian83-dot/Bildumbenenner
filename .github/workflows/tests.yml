name: Automated tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    name: Node tests (no browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node tools/build-identity.cjs --check
      - run: node tests/laborwerte.cjs
      - run: node tests/bohrkern-fotos.cjs
      - run: node tests/hilfe-links.cjs
      - run: node tests/skalenregel.cjs
      - run: node tests/skalen-archiv.cjs
      - run: node tests/pdf-layout.cjs
      - run: node tests/project-store.cjs
      - run: node tests/unknown-fields.cjs
      - run: node tests/n2-speichersicherheit.cjs
      - run: node tests/n3-await-condition.cjs
      - run: node tests/n3-writer-conflict.cjs
      - run: node tests/ordnername.cjs
      - run: node tests/umbenennen-rollback.cjs

  browser-tests:
    name: Browser tests (${{ matrix.browser }})
    # Playwright 1.56.1 supports this image; ubuntu-latest may advance beyond it.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Bei einem Abbruch steht die Fehlermeldung als Hinweis am Lauf (tests/ci-fehler.cjs); erst nach dem Auschecken setzen
      - run: echo "NODE_OPTIONS=--require ${{ github.workspace }}/tests/ci-fehler.cjs" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Playwright (pinned, not part of the repository)
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}
      - name: PDF design, exact image streams, logo and pagination
        run: node tests/ci-wiederholen.cjs tests/pdf-layout-browser.cjs ${{ matrix.browser }}
      - name: Loaded build and safe update UX
        run: |
          node tests/n3-updates-browser.cjs ${{ matrix.browser }}
          node tests/n3-recovery-browser.cjs ${{ matrix.browser }}
          node tests/n3-offline-browser.cjs ${{ matrix.browser }}
      - name: Project data (_Projekt.json) in the real browser
        run: node tests/ci-wiederholen.cjs tests/projektdaten-browser.cjs ${{ matrix.browser }}
      - name: Independent F3 sessions and explicit recovery (synthetic shared disk)
        run: node tests/ci-wiederholen.cjs tests/project-store-browser.cjs ${{ matrix.browser }}
      - name: F6 unknown JSON fields, editing, retry, exports and future-version protection
        run: node tests/ci-wiederholen.cjs tests/unknown-fields-browser.cjs ${{ matrix.browser }}
      - name: Mosaik bar (project, steps, next step) in the real browser
        run: node tests/ci-wiederholen.cjs tests/leiste-browser.cjs ${{ matrix.browser }}
      - name: Fotos folder → project, sort by section, PDF name without overwriting
        run: node tests/ci-wiederholen.cjs tests/sortierung-export-browser.cjs ${{ matrix.browser }}
      - name: Safe project transitions, save failures, retries, reload and update
        run: node tests/ci-wiederholen.cjs tests/sicherer-projektwechsel-browser.cjs ${{ matrix.browser }}
      - name: Protected projects preserve originals and metadata, including direct file actions
        run: node tests/ci-wiederholen.cjs tests/geschuetzter-projektmodus-browser.cjs ${{ matrix.browser }}
      - name: Settings disclosure and unchanged workflows at desktop and narrow widths
        run: node tests/ci-wiederholen.cjs tests/oberflaeche-browser.cjs ${{ matrix.browser }}
      - name: Series labelling with 5, 50 and 150 images, keyboard and preview races
        run: node tests/ci-wiederholen.cjs tests/serienbeschriftung-browser.cjs ${{ matrix.browser }}
      - name: Vorschläge beim Tippen der Beschreibung (LabelKit-Proben, Projektbeschreibungen)
        run: node tests/ci-wiederholen.cjs tests/beschreibung-vorschlag-browser.cjs ${{ matrix.browser }}
      - name: Planned name and conflicts stay visible in the photo row (320, 390, 1280 px)
        run: node tests/ci-wiederholen.cjs tests/zeile-geplant-browser.cjs ${{ matrix.browser }}
      - name: Consistent numbering and actual PDF, CSV and ZIP output with 5, 50 and 150 images
        run: node tests/ci-wiederholen.cjs tests/bildnummerierung-browser.cjs ${{ matrix.browser }}
      - name: Fotos übernehmen and current project in the real browser
        run: node tests/ci-wiederholen.cjs tests/fotos-uebernehmen-browser.cjs ${{ matrix.browser }}
      - name: Active project context stays consistent across URL, FotoKit and suite navigation
        run: node tests/ci-wiederholen.cjs tests/projektkontext-browser.cjs ${{ matrix.browser }}
      - name: Independent sessions retain complete confirmed photo metadata and explicit recovery
        run: node tests/ci-wiederholen.cjs tests/n2-speichersicherheit-browser.cjs ${{ matrix.browser }}
